<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anne</title>
  <style>
    :root { --bg:#f7fafc; --card:#fff; --line:#d9dee6; --text:#243042; --muted:#667085; --accent:#f5a623; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    .page { max-width:1180px; margin:0 auto; padding:14px 14px 28px; }
    .topbar, .modebar, .catalog-card, .panel, .question-card, .chunk-card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 4px 16px rgba(16,24,40,.05); }
    .topbar { padding:12px 14px; margin-bottom:12px; }
    .quiz-header { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; }
    .sat-logo { display:grid; gap:8px; }
    .bible-top-control-strip { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .bible-header-nav, .bible-top-actions, .top-tools, .playback, .mode-group, .lang-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:10px; }
    .study-nav-host { min-width:0; }
    .study-nav-btn { display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; height:36px; padding:0 12px; border:2px solid #ffd166; border-radius:10px; background:#ffb020; color:#102a43; box-shadow:0 3px 10px rgba(105,61,0,.28); font:850 15px/1 system-ui,sans-serif; cursor:pointer; }
    .study-nav-label { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:clip; text-align:left; }
    .top-tools, .playback, .mode-group, .lang-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .tool-btn, .mode-btn, .nav-btn, .play-btn, .speed-select, .lang-select { border:1px solid var(--line); background:#fff; color:var(--text); border-radius:12px; min-height:36px; padding:0 12px; font:inherit; }
    .tool-btn, .mode-btn, .nav-btn, .play-btn { cursor:pointer; }
    .tool-btn.secondary, .nav-btn.secondary { background:#fafbfc; }
    .tool-btn:disabled, .mode-btn:disabled, .play-btn:disabled, .nav-btn:disabled, .speed-select:disabled, .lang-select:disabled { opacity:.55; cursor:not-allowed; }
    .public-pill { border:1px solid #f3d08c; background:#fff7e6; color:#8a4d00; font-size:12px; font-weight:800; padding:6px 10px; border-radius:999px; }
    .main-row { display:grid; grid-template-columns: 300px 1fr; gap:12px; margin-top:12px; }
    .panel { padding:14px; }
    .panel h2 { margin:0 0 12px; font-size:18px; letter-spacing:.2px; }
    .catalog-grid { display:grid; gap:10px; }
    .catalog-card { width:100%; text-align:left; padding:14px; cursor:pointer; }
    .catalog-card.active { border-color:var(--accent); background:#fff8eb; }
    .catalog-title { font-weight:800; margin-bottom:4px; }
    .catalog-meta { color:var(--muted); font-size:12px; }
    .status { margin-top:12px; padding:10px 12px; background:#fff7e8; border-radius:12px; color:#7a4a00; font-size:14px; }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .counter { margin-left:auto; color:var(--muted); font-size:13px; }
    .question-card { padding:16px; }
    .sentence-meta { color:var(--muted); font-size:12px; margin-bottom:10px; }
    .sentence-en { font-size:20px; line-height:1.55; font-weight:800; margin-bottom:12px; }
    .sentence-ko { font-size:18px; line-height:1.6; margin-bottom:14px; color:#1f2937; }
    .question { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
    .question-en { font-weight:800; margin-bottom:4px; }
    .question-ko { color:var(--muted); margin-bottom:10px; }
    .choices { display:grid; gap:8px; }
    .choice { border:1px solid var(--line); background:#fafbfc; border-radius:12px; padding:10px 12px; }
    .choice b { display:inline-block; width:20px; color:var(--accent); }
    .choice-en, .choice-ko { display:block; margin-left:24px; }
    .answer, .explain { margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
    .chunks { margin-top:14px; }
    .chunk-head { font-size:18px; font-weight:800; margin-bottom:10px; }
    .chunk-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:10px; }
    .chunk-card { padding:12px; }
    .chunk-no { width:24px; height:24px; border-radius:999px; background:#fff3d8; color:#8a4d00; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; margin-bottom:8px; }
    .chunk-en { font-weight:800; margin-bottom:4px; }
    .chunk-ko { color:var(--muted); font-size:13px; }
    .empty { color:var(--muted); padding:12px 0; }
    .learning-preview { display:grid; grid-template-columns: 1fr auto; gap:12px; margin-top:12px; }
    .mini-card { padding:12px 14px; }
    .mini-label { color:var(--muted); font-size:12px; margin-bottom:6px; }
    .mode-group { gap:6px; }
    .mode-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:800; }
    .lang-stack { display:grid; gap:6px; align-items:center; grid-auto-flow:column; }
    .lang-label { color:var(--muted); font-size:12px; }
    .study-backdrop { position:fixed; inset:0; z-index:20000; display:grid; align-items:start; justify-items:center; padding:max(72px, env(safe-area-inset-top)) 12px 18px; background:rgba(3,20,35,.5); }
    .study-backdrop[hidden] { display:none; }
    .study-panel { width:min(430px,100%); max-height:min(72vh,680px); overflow:hidden; border:1px solid #b8c9da; border-radius:16px; background:#fff; color:#172033; box-shadow:0 22px 60px rgba(0,0,0,.34); }
    .study-head { display:grid; grid-template-columns:42px 1fr 42px; align-items:center; min-height:48px; border-bottom:1px solid #dce5ee; background:#f7fafc; }
    .study-head button { height:42px; border:0; background:transparent; color:#123a67; font-size:22px; font-weight:850; }
    .study-path { text-align:center; font-size:13px; font-weight:850; white-space:nowrap; overflow:hidden; }
    .study-list { max-height:calc(min(72vh,680px) - 49px); overflow-y:auto; padding:8px; }
    .study-item { display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; padding:10px 13px; border:0; border-bottom:1px solid #e5ebf1; background:#fff; color:#172033; font:800 16px/1.25 system-ui,sans-serif; text-align:left; cursor:pointer; }
    .study-item:hover { background:#fff7e6; }
    @media (max-width: 980px) {
      .main-row, .learning-preview { grid-template-columns:1fr; }
      .counter { margin-left:0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="quiz-header">
        <div class="sat-logo">
          <div class="brand">
            <div class="study-nav-host" id="studyNavHost"></div>
          </div>
          <div class="bible-top-control-strip">
            <div class="bible-header-nav" aria-label="Bible reference tools">
              <button class="tool-btn secondary" type="button" disabled title="Open Bible Atlas">🌐</button>
              <button class="tool-btn secondary" type="button" disabled title="Open Bible People">👤</button>
            </div>
            <div class="bible-top-actions" aria-label="Help and account">
              <button class="tool-btn secondary" type="button" disabled title="Open user guide">?</button>
            </div>
          </div>
        </div>
        <div class="lang-group">
          <div>
            <div class="lang-label">Language</div>
            <select class="lang-select" id="languageSelector">
              <option value="EN">English</option>
              <option value="KO">한국어</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <section class="panel" style="margin-bottom:12px">
      <div class="playback">
        <button class="play-btn" type="button" id="playBtn">▶ Play</button>
        <button class="play-btn" type="button" id="replayBtn">↻ Replay</button>
        <button class="play-btn" type="button" id="stopBtn">■ Stop</button>
        <select class="speed-select" id="speedSelect" aria-label="Reading speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1.0×</option>
          <option value="1.25">1.25×</option>
        </select>
        <button class="play-btn" type="button" id="autoBtn">AUTO</button>
      </div>
      <div class="learning-preview">
        <div class="mode-group">
          <button class="mode-btn" type="button" data-mode="Lrn">Lrn</button>
          <button class="mode-btn active" type="button" data-mode="Std">Std</button>
          <button class="mode-btn" type="button" data-mode="Exm">Exm</button>
        </div>
        <div class="lang-stack">
          <div>
            <div class="lang-label">First language</div>
            <select class="lang-select" id="primaryLanguage">
              <option value="ENG" selected>ENG</option>
              <option value="KOR">KOR</option>
              <option value="NONE">NONE</option>
            </select>
          </div>
          <div>
            <div class="lang-label">Second language</div>
            <select class="lang-select" id="secondaryLanguage">
              <option value="ENG">ENG</option>
              <option value="KOR" selected>KOR</option>
              <option value="NONE">NONE</option>
            </select>
          </div>
        </div>
      </div>
      <div id="status" class="status">Loading...</div>
    </section>

    <div class="main-row">
      <aside class="panel">
        <h2>AVAILABLE CONTENT</h2>
        <div id="catalog"></div>
      </aside>

      <main class="panel">
        <div class="toolbar">
          <button class="nav-btn" id="prevBtn" type="button">← Back</button>
          <button class="nav-btn" id="nextBtn" type="button">Forward →</button>
          <div class="counter" id="counter">0 / 0</div>
        </div>
        <div id="reader"></div>
        <section class="chunks">
          <div class="chunk-head">CHUNK</div>
          <div id="chunks"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="study-backdrop" id="studyBackdrop" hidden>
    <section class="study-panel" role="dialog" aria-modal="true" aria-label="Select study">
      <header class="study-head">
        <button type="button" data-back aria-label="Back">‹</button>
        <div class="study-path" id="studyPath"></div>
        <button type="button" data-close aria-label="Close">×</button>
      </header>
      <div class="study-list" id="studyList"></div>
    </section>
  </div>

  <script src="./supabase-config.js?v=c3ebfb4"></script>
  <script src="./main.js?v=c3ebfb4"></script>
</body>
</html>
